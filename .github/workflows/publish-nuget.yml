name: Publish to NuGet

on:
  push:
    tags: ['v*']            # v1.1.2.0 のようなタグを push したら公開する
  workflow_dispatch:        # Actions 画面から手動実行もできる
    inputs:
      publish:
        description: 'nuget.org に push する（オフなら pack とログイン確認だけ）'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: windows-latest
    environment: release    # nuget.org のポリシーの Environment と一致させる
    permissions:
      id-token: write       # GitHub に OIDC トークン（証明書）の発行を許可する。必須
      contents: read        # checkout 用

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          dotnet pack ./mfsr/mfsr.csproj -c Release -o nuget-packages
          dotnet pack ./mfprobe/mfprobe.csproj -c Release -o nuget-packages

      - name: Upload packages (確認用)
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: nuget-packages/

      - name: NuGet login (OIDC → 一時APIキー)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        if: github.event_name == 'push' || inputs.publish
        run: >
          dotnet nuget push "nuget-packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
          